<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #e0e0e0;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
    }
    .message {
      display: none;
      max-width: 800px;
      text-align: left;
      margin-bottom: 2rem;
      line-height: 1.8;
      font-size: 1.2rem;
      white-space: pre-wrap;
      background: #1e1e1e;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
    }
    button {
      background: #2c2c2c;
      border: 1px solid #444;
      color: #e0e0e0;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.3s;
    }
    button:hover {
      background: #3e3e3e;
    }
    #playBtn {
      position: absolute;
      top: 1rem;
      right: 1rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #ff4444;
    }
    h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #ff7f7f;
    }
    .author {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #b0b0b0;
    }
  </style>
</head>
<body>
  <audio id="backgroundMusic" loop>
    <source src="music.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>
  <button id="playBtn">Play Music<br>(if you want)</button>

  <h1>Crime and Punishment</h1>
  <div class="author">by Fyodor Dostoevsky</div>
  <div id="message" class="message"></div>
  <button id="nextBtn">Continue</button>

  <script>
    const parts = [
      `“Pain and suffering are always inevitable for a large intelligence and a deep heart.”
      Suffering is a natural part of deep awareness and sensitivity. It is through our darkest moments that we often find the light of understanding and empathy. The depth of our emotions, both joyous and sorrowful, defines the richness of our human experience.`,

      `“To go wrong in one's own way is better than to go right in someone else's.”
      Personal freedom, even in error, is more valuable than borrowed correctness. It is in our mistakes and our unique paths that we discover our true selves. The journey of self-discovery is fraught with trials, but it is a journey worth taking.`,

      `“Power is given only to him who dares to stoop and take it... one must have the courage to dare.”
      True power belongs to those bold enough to seize it, regardless of the cost. It requires courage to step into the unknown, to challenge the status quo, and to embrace the responsibilities that come with power.`,

      `“Man grows used to everything, the scoundrel!”
      Human beings can adapt even to moral decay, often losing their sense of guilt. The ability to normalize the abnormal is a testament to our resilience, but it also serves as a cautionary tale about the dangers of complacency and the erosion of moral standards.`,

      `“I did not bow down to you, I bowed down to all the suffering of humanity.”
      This quote underscores the profound empathy and humility that can arise from acknowledging the collective pain and struggles of others. It highlights the importance of recognizing the universal experience of suffering and the need for compassion and understanding.`
    ];

    let index = 0;
    const msgBox = document.getElementById('message');
    const nextBtn = document.getElementById('nextBtn');
    const playBtn = document.getElementById('playBtn');
    const backgroundMusic = document.getElementById('backgroundMusic');

    playBtn.addEventListener('click', () => {
      backgroundMusic.play();
    });

    nextBtn.addEventListener('click', () => {
      if (index < parts.length) {
        msgBox.innerText = parts[index];
        msgBox.style.display = 'block';
        index++;
        if (index === parts.length) {
          nextBtn.innerText = 'Close';
        }
      } else {
        document.body.innerHTML = "<h2 style='color: white;'>Thank you for reading.</h2>";
      }
    });
  </script>
</body>
</html>
